<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Users</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <link rel="icon" href="./favicon-16x16.png" type="image/x-icon">


    <style>
          body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: rgb(5, 5, 5);
        color: white;
        height: 100vh;
      }
      .container {
        margin: auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        color: rgb(255, 255, 255);
        gap: 20px;
        padding-bottom: 80px;
      }
      .box {
        height: fit-content;
        width: 200px;
        background-color: rgb(0, 0, 0);
        font-family: Arial, Helvetica, sans-serif;
        padding: 10px;
        text-align: center;
        border-radius: 6px;
        border: 2px solid rgb(20, 19, 19);
        transition: transform 0.3s ease-in;
      }
      .box:hover {
        transform: scale(1.08);
        box-shadow: 1px 1px 5px rgba(122, 9, 9, 0.425),
          -0px -0px 10px rgb(11, 2, 44);
      }
      img {
        width: 100%;
        height: 60%;
        border-radius: 2px;
        object-fit: cover;
      }
      h3 {
        font-size: 16px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      a {
        font-size: 12px;
        background-color: #161414;
        padding: 5px;
        border-radius: 5px;
        color: orange;
        text-decoration: none;
      }
      h1 {
        text-align: center;
        margin-top: 30px;
        margin-bottom: 30px;
      }
      i{
        filter: invert(0.3);
      }
      footer{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding-top: 30px;
        font-weight: 550;
        font-size: 16px;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      }
      .orange{
        color: chocolate;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 15px;
      }
      .sky{
        color: rgb(0, 117, 163);
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 17px;
        
      }
      .yellow{
        color: rgb(255, 230, 2);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 16px;
      }
      .name{
          background: linear-gradient(90deg, #ff512f, #dd2476);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          font-size: 20px;
          cursor: pointer;

      }
    </style>
</head>
<body>
    <h1><i class="fa-solid fa-circle-user"></i> Github Users</h1>
    <div class="container"></div>

    <footer>
      <p>Designed and Developed by <span class="name">Tauqeer Ahmad</span></p>
      <p>Web Development student |  <span class="orange">HTML</span> • <span class="sky">CSS</span> • <span class="yellow">JavaScript</span></p>
    </footer>
 <script>
 async function githubUsers(){
    
    try{
        let container = document.querySelector(".container");

       const token = "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";

        let api = await fetch("https://api.github.com/users",{
            headers:{
                Authorization: `token ${token}`
            }
        })
        
        if(!api.ok){
            throw new Error("data not found...")
        }
        
        let data = await api.json();
        console.log(data)

        for(let user of data){
            let profile = document.createElement("div")
            profile.classList.add("box");

            let image = document.createElement("img");
            image.src = user.avatar_url;

            let username = document.createElement("h3");
            username.textContent = user.login;

            let ProfileLink = document.createElement("a");
            ProfileLink.href = user.html_url;
            ProfileLink.textContent = "Visit profile";

            container.append(profile);
            profile.append(image,username,ProfileLink)
        }
    }
    catch(error){
       const msg = document.querySelector(".container");
       msg.style.fontFamily = "Arial, Helvetica, sans-serif";

        if(error.message === "Failed to fetch"){
            msg.textContent =  "Network error. Please check your connection."
        }else{
            msg.textContent = error.message
        }
    }
}

githubUsers()
    </script>
</body>
</html>
